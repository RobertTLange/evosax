        { "SNES" = "reference/algorithms/snes.md" },
        { "MA-ES" = "reference/algorithms/ma_es.md" },
        { "LM-MA-ES" = "reference/algorithms/lm_ma_es.md" },
        { "Rm-ES" = "reference/algorithms/rm_es.md" },
        { "PGPE" = "reference/algorithms/pgpe.md" },
        { "ARS" = "reference/algorithms/ars.md" },
        { "ESMC" = "reference/algorithms/esmc.md" },
        { "Persistent ES" = "reference/algorithms/persistent_es.md" },
        { "Noise-Reuse ES" = "reference/algorithms/noise_reuse_es.md" },
        { "CR-FM-NES" = "reference/algorithms/cr_fm_nes.md" },
        { "Guided ES" = "reference/algorithms/guided_es.md" },
        { "ASEBO" = "reference/algorithms/asebo.md" },
