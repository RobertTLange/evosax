[project.theme]
language = "en"
logo = "logo.png"
favicon = "logo.png"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

# Follow the system colour scheme, with a manual toggle
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

# API reference generated from docstrings. Sources are parsed statically, so the
# package does not need to be importable.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
filters = ["!^_", "!^num_elites$"]
inherited_members = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_if_no_docstring = false
show_root_full_path = false
show_root_heading = true
show_signature_annotations = true
show_source = false

# Treat a wrapped "Returns:" section as one description, not one item per line
[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
returns_multiple_items = false
